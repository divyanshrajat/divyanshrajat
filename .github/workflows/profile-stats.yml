name: Refresh profile stats

on:
  schedule:
    - cron: "17 2 * * *"   # every day at 07:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/stats.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dark/stats.svg assets/light/stats.svg assets/dark/activity.svg assets/light/activity.svg
          git diff --cached --quiet || (git commit -m "chore: refresh profile stats" && git push)
